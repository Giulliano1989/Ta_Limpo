<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Tela de Login</title>
  </head>
  <body>
    <div class="col vh-100">
      <div class="row h-100">
        <div class="col-4 d-flex justify-content-center align-items-center">
          <img
            th:src="@{/assets/img/logo.png}"
            style="width: 700px; height: auto"
            alt="Logo"
          />
        </div>
        <div
          class="col-8 d-flex justify-content-center align-items-center d-flex flex-column bg-secondary"
        >
          <h1>Bem-Vindo</h1>
          <h6>Faça login para acessar o sistema</h6>
          <form th:action="@{/login}" method="post">  
            <br>
            <label class="form-label text-center d-block">Usuario</label>
            <input type="text" name="usuario" class="form-control shadow-sm mb-4" />
            <br />
            <label class="form-label text-center d-block">Senha</label>
            <input type="password" name="senha" class="form-control shadow-sm mb-3"/><br />
            <br />
            <div class="text-center">
              <button type="submit" name="entrar" class="btn btn-dark">ENTRAR</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
