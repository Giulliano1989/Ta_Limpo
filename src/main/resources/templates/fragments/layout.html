<header th:fragment="header" class="bg-white border-bottom border-primary">
  <div class="container-fluid px-4 py-2 d-flex justify-content-between align-items-center">
    <img th:src="@{/assets/img/logo.png}" alt="TA LIMPO" height="90" />

    <div class="d-none d-md-flex align-items-center gap-2">
      <i class="bi bi-person-circle fs-3 text-primary"></i>
      <div>
        <strong class="d-block">Carlos Eduardo</strong>
        <small class="text-secondary">Administrador</small>
      </div>
    </div>

    <button
      class="btn btn-outline-primary d-md-none"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#mobileSidebar"
      aria-controls="mobileSidebar"
      aria-label="Abrir menu"
    >
      <i class="bi bi-list"></i>
    </button>
  </div>
</header>

<th:block th:fragment="sidebar(activePage)">
  <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
    <div class="offcanvas-header">
      <h5 id="mobileSidebarLabel">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>
    <nav class="nav nav-pills flex-column gap-2 p-3">
      <a href="/inicio" class="nav-link text-white" th:classappend="${activePage == 'inicio'} ? ' active' : ''">
        <i class="bi bi-house-door me-2"></i>Página Inicial
      </a>
      <a href="/veiculos" class="nav-link text-white" th:classappend="${activePage == 'veiculos'} ? ' active' : ''">
        <i class="bi bi-car-front me-2"></i>Lista de Veículos
      </a>
      <a href="/status" class="nav-link text-white" th:classappend="${activePage == 'status'} ? ' active' : ''">
        <i class="bi bi-clipboard-data me-2"></i>Status
      </a>
      <a href="/admin" class="nav-link text-white" th:classappend="${activePage == 'admin'} ? ' active' : ''">
        <i class="bi bi-person-gear me-2"></i>Admin
      </a>
    </nav>
  </div>

  <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 d-none d-md-block">
    <nav class="nav nav-pills flex-column p-3 gap-2">
      <a href="/inicio" class="nav-link text-white" th:classappend="${activePage == 'inicio'} ? ' active' : ''">
        <i class="bi bi-house-door me-2"></i>Página Inicial
      </a>
      <a href="/veiculos" class="nav-link text-white" th:classappend="${activePage == 'veiculos'} ? ' active' : ''">
        <i class="bi bi-car-front me-2"></i>Lista de Veículos
      </a>
      <a href="/status" class="nav-link text-white" th:classappend="${activePage == 'status'} ? ' active' : ''">
        <i class="bi bi-clipboard-data me-2"></i>Status
      </a>
      <a href="/admin" class="nav-link text-white" th:classappend="${activePage == 'admin'} ? ' active' : ''">
        <i class="bi bi-person-gear me-2"></i>Admin
      </a>
    </nav>
  </aside>
</th:block>
