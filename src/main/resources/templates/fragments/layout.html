
<!-- MENU MOBILE -->
<div
  th:fragment="menuMobile(paginaAtual)"
  class="offcanvas offcanvas-start bg-dark text-white d-md-none"
  tabindex="-1"
  id="menuMobile"
  aria-labelledby="tituloMenuMobile">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="tituloMenuMobile">Menu</h5>
    <button
      type="button"
      class="btn-close btn-close-white"
      data-bs-dismiss="offcanvas"
      aria-label="Fechar menu"
    ></button>
  </div>

  <div class="offcanvas-body p-0">
    <div th:replace="~{fragments/layout :: itensMenu(${paginaAtual})}"></div>
  </div>
</div>

<!-- CABECALHO  -->
<header th:fragment="cabecalho" class="bg-white border-bottom border-primary">
      <div
        class="container-fluid px-4 py-2 d-flex justify-content-between align-items-center"
      >
        <img th:src="@{/assets/img/logo.png}" alt="TA LIMPO" height="90" />

        <button
          type="button"
          class="btn btn-outline-primary d-md-none"
          data-bs-toggle="offcanvas"
          data-bs-target="#menuMobile"
          aria-controls="menuMobile"
          aria-label="Abrir menu">
          <i class="bi bi-list fs-4"></i>
        </button>

        <div class="d-none d-md-flex align-items-center gap-2">
          <i class="bi bi-person-circle fs-3 text-primary"></i>

          <div>
            <strong class="d-block"> Carlos Eduardo </strong>

            <small class="text-secondary"> Administrador </small>
          </div>
        </div>
      </div>
    </header>


<!-- MENU LATERAL COM  IDENTIFICACAO DE MENU ATIVO -->
<aside th:fragment="menuLateral(paginaAtual)" class="col-md-3 col-lg-2 d-none d-md-block bg-dark min-vh-100 p-0">
  <div th:replace="~{fragments/layout :: itensMenu(${paginaAtual})}"></div>
</aside>

<!-- ITENS dos menus lateral e mobile -->
<nav th:fragment="itensMenu(paginaAtual)" class="nav nav-pills flex-column p-3 gap-2">
  <a href="/inicio" class="nav-link text-white" th:classappend="${paginaAtual == 'inicio' ? 'active' : ''}">
    <i class="bi bi-house-door me-2"></i>
    Página Inicial
  </a>
  <a href="/veiculos" class="nav-link text-white" th:classappend="${paginaAtual == 'veiculos' ? 'active' : ''}">
    <i class="bi bi-car-front me-2"></i>
    Lista de Veículos
  </a>
  <a href="/status" class="nav-link text-white" th:classappend="${paginaAtual == 'status' ? 'active' : ''}">
    <i class="bi bi-clipboard-data me-2"></i>
    Status
  </a>
  <a href="/admin" class="nav-link text-white" th:classappend="${paginaAtual == 'admin' ? 'active' : ''}">
    <i class="bi bi-person-gear me-2"></i>
    Admin
  </a>
</nav>

<!-- Modal de cadastro de veículo -->
<div th:fragment="modalCadastroVeiculo" class="modal" tabindex="-1" id="modal_veiculos">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Novo veículo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>

      <div class="modal-body">
        <form id="form-cadastro-veiculo">
          <div class="mb-3">
            <label for="marca" class="form-label">Marca:</label>
            <input type="text" id="marca" name="marca" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="modelo" class="form-label">Modelo:</label>
            <input type="text" id="modelo" name="modelo" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="placa" class="form-label">Placa:</label>
            <input type="text" id="placa" name="placa" class="form-control" required />
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <button type="button" class="btn btn-primary" onclick="cadastrarVeiculo()">Cadastrar</button>
      </div>
    </div>
  </div>
</div>
