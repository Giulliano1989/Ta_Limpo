<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TA LIMPO - Página Inicial</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-light">
    <header class="bg-white border-bottom border-primary">
      <div
        class="container-fluid px-4 py-2 d-flex justify-content-between align-items-center"
      >
        <img th:src="@{/assets/img/logo.png}" alt="TA LIMPO" height="90" />

        <div class="d-none d-md-flex align-items-center gap-2">
          <i class="bi bi-person-circle fs-3 text-primary"></i>

          <div>
            <strong class="d-block"> Carlos Eduardo </strong>

            <small class="text-secondary"> Administrador </small>
          </div>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 d-none d-md-block">
          <nav class="nav nav-pills flex-column p-3 gap-2">
            <a href="/inicio" class="nav-link active text-white">
              <i class="bi bi-house-door me-2"></i>

              Página Inicial
            </a>

            <a href="/veiculos" class="nav-link text-white">
              <i class="bi bi-car-front me-2"></i>

              Lista de Veículos
            </a>

            <a href="/status" class="nav-link text-white">
              <i class="bi bi-clipboard-data me-2"></i>

              Status
            </a>

            <a href="/admin" class="nav-link text-white">
              <i class="bi bi-person-gear me-2"></i>

              Admin
            </a>
          </nav>
        </aside>

        <main class="col-md-9 col-lg-10 p-4">
          <div class="mb-4">
            <h2>Página Inicial</h2>

            <p class="text-secondary mb-0">Bem-vindo ao sistema TA LIMPO.</p>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <div class="card h-100">
                <div class="card-body">
                  <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-car-front text-primary fs-1"></i>

                    <div>
                      <h6>Veículos hoje</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="card h-100">
                <div class="card-body">
                  <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-droplet text-warning fs-1"></i>

                    <div>
                      <h6>Em lavagem</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="card h-100">
                <div class="card-body">
                  <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-check-circle text-success fs-1"></i>

                    <div>
                      <h6>Finalizados</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header bg-white">
              <h5 class="mb-1">
                <i class="bi bi-lightning-charge text-primary me-1"></i>

                Ações Rápidas
              </h5>
            </div>

            <div class="list-group list-group-flush">
              <a
                href="/veiculos"
                class="list-group-item list-group-item-action"
              >
                <i class="bi bi-plus-circle text-primary me-2"></i>

                <strong> Cadastrar veículo </strong>
              </a>

              <a href="/admin" class="list-group-item list-group-item-action">
                <i class="bi bi-person-plus text-primary me-2"></i>

                <strong> Cadastrar usuário </strong>
              </a>

              <a
                href="/veiculos"
                class="list-group-item list-group-item-action"
              >
                <i class="bi bi-list-ul text-primary me-2"></i>

                <strong> Ver veículos </strong>
              </a>

              <a href="/status" class="list-group-item list-group-item-action">
                <i class="bi bi-search text-primary me-2"></i>

                <strong> Consultar status </strong>
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
