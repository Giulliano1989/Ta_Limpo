<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    
    <header class="d-flex justify-content-between bg-light align-items-center px-4 py-3 border-bottom border-primary">
      <div class="d-flex align-items-center gap-3">
        <img th:src="@{/assets/img/logo.png}" alt="TCC" height="120" />
        <span class="fs-4 d-none d-md-inline"></span>
      </div>
      <div> <span class="fs-4 d-none d-md-inline">Carlos Eduardo</span></div>

      <button
        class="btn btn-outline-primary d-md-none"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-controls="sidebar"
        aria-label="Abrir menu"
      >
        <i class="bi bi-list"></i>
      </button>
    </header>

    <div class="d-md-flex">
      
      <div class="offcanvas offcanvas-start d-md-none bg-dark text-white" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="offcanvas-header">
          <h5 id="sidebarLabel" class="text-white">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body p-0">
          <nav class="nav nav-pills flex-column py-4 px-3">
            <a href="/inicio" class="nav-link active text-white">
              <i class="bi bi-house"></i> <span>Pagina Inicial</span>
            </a>
            <a href="/veiculos" class="nav-link text-white">
              <i class="bi bi-car-front"></i> <span>Lista de Veículos</span>
            </a>
            <a href="/status" class="nav-link text-white">
              <i class="bi bi-clipboard-data"></i> <span>Status</span>
            </a>
            <a href="/admin" class="nav-link text-white">
              <i class="bi bi-person-gear"></i> <span>Admin</span>
            </a>
          </nav>
        </div>
      </div>

      
      <div class="d-none d-md-block">
        <nav class="bg-dark vh-100" style="width: 300px">
          <ul class="nav nav-pills flex-column py-4 px-3">
            <li class="nav-item">
              <a href="/inicio" class="nav-link active text-white">
                <i class="bi bi-house"></i> <span>Pagina Inicial</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/veiculos" class="nav-link text-white">
                <i class="bi bi-car-front"></i> <span>Lista de Veículos</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/status" class="nav-link text-white">
                <i class="bi bi-clipboard-data"></i> <span>Status</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/admin" class="nav-link text-white">
                <i class="bi bi-person-gear"></i> <span>Admin</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      
      <main class="w-100 p-4">
        <h2 class="border-bottom border-primary pb-3 mb-3">Página Inicial</h2>
        <p>Seja bem vindo ao sistema!</p>
        <div class="row g-3">
          <div class="col-6 col-md-3 col-xl-2">
             <form action="" method="post">
              <a href="veiculos" class="btn btn-outline-primary p-4 d-block">
                <div class="display-6"><i class="bi bi-house"></i></div>
                <div>Cadastrar Carro</div>
              </form>
            </a>
          </div>
          <div class="col-6 col-md-3 col-xl-2">
            <a href="#" class="btn btn-outline-primary p-4 d-block">
              <div class="display-6"><i class="bi bi-house"></i></div>
              <div>Cadastrar Usuário</div>
            </a>
          </div>
          <div class="col-6 col-md-3 col-xl-2">
            <a href="#" class="btn btn-outline-primary p-4 d-block">
              <div class="display-6"><i class="bi bi-house"></i></div>
              <div>Verificar Status</div>
            </a>
          </div>
          <div class="col-6 col-md-3 col-xl-2">
            <a href="#" class="btn btn-outline-primary p-4 d-block">
              <div class="display-6"><i class="bi bi-house"></i></div>
              <div>Verificar Relatório</div>
            </a>
          </div>

        </div>
      </main>
    </div>

    <footer></footer>

    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
