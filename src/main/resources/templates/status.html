<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TA LIMPO - Status</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-light">
    <header th:replace="~{fragments/layout :: cabecalho}"></header>
    
    <div th:replace="~{fragments/layout :: menuMobile('status')}"></div>
    

    <div class="container-fluid">
      <div class="row">
        <aside th:replace="~{fragments/layout :: menuLateral('status')}"></aside>

        <main class="col-md-9 col-lg-10 p-3 p-md-4">
          <div class="mb-4">
            <h2 class="mb-1">Status</h2>

            <p class="text-secondary mb-0">
              Acompanhe os veículos durante a lavagem.
            </p>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <div class="card">
                <div class="card-body">
                  <div class="d-flex align-items-center">
                    <i class="bi bi-hourglass-split text-warning fs-1 me-3"></i>

                    <div>
                      <h6>Aguardando</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="card">
                <div class="card-body">
                  <div class="d-flex align-items-center">
                    <i class="bi bi-droplet text-primary fs-1 me-3"></i>

                    <div>
                      <h6>Lavando</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="card">
                <div class="card-body">
                  <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle text-success fs-1 me-3"></i>

                    <div>
                      <h6>Finalizados</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-header">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h5 class="mb-1">
                        <i class="bi bi-hourglass-split me-1"></i>

                        Aguardando
                      </h5>
                    </div>
                  </div>
                </div>
                <div class="card-body" id="lista_aguardando"></div>
              </div>
            </div>

            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-header">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h5 class="mb-1">
                        <i class="bi bi-droplet me-1"></i>

                        Lavando
                      </h5>
                    </div>
                  </div>
                </div>

                <div class="card-body" id="lista_lavando"></div>
              </div>
            </div>

            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-header">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h5 class="mb-1">
                        <i class="bi bi-check-circle me-1"></i>

                        Finalizados
                      </h5>
                    </div>
                  </div>
                </div>

                <div class="card-body" id="lista_finalizado"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/status.js}"></script>
  </body>
</html>
