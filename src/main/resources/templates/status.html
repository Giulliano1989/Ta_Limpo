<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TA LIMPO - Status</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-light">
    <header class="bg-white border-bottom border-primary">
      <div
        class="container-fluid px-4 py-2 d-flex justify-content-between align-items-center"
      >
        <img th:src="@{/assets/img/logo.png}" alt="TA LIMPO" height="90" />

        <div class="d-none d-md-flex align-items-center gap-2">
          <i class="bi bi-person-circle fs-3 text-primary"></i>

          <div>
            <strong class="d-block"> Carlos Eduardo </strong>
          </div>
        </div>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-md-3 col-lg-2 bg-dark min-vh-100 d-none d-md-block">
          <nav class="nav nav-pills flex-column gap-2 p-3">
            <a href="/inicio" class="nav-link text-white">
              <i class="bi bi-house me-2"></i>

              Página Inicial
            </a>

            <a href="/veiculos" class="nav-link text-white">
              <i class="bi bi-car-front me-2"></i>

              Lista de Veículos
            </a>

            <a href="/status" class="nav-link active text-white">
              <i class="bi bi-clipboard-data me-2"></i>

              Status
            </a>

            <a href="/admin" class="nav-link text-white">
              <i class="bi bi-person-gear me-2"></i>

              Admin
            </a>
          </nav>
        </aside>

        <main class="col-md-9 col-lg-10 p-3 p-md-4">
          <div class="mb-4">
            <h2 class="mb-1">Status</h2>

            <p class="text-secondary mb-0">
              Acompanhe os veículos durante a lavagem.
            </p>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <div class="card">
                <div class="card-body">
                  <div class="d-flex align-items-center">
                    <i class="bi bi-hourglass-split text-warning fs-1 me-3"></i>

                    <div>
                      <h6>Aguardando</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="card">
                <div class="card-body">
                  <div class="d-flex align-items-center">
                    <i class="bi bi-droplet text-primary fs-1 me-3"></i>

                    <div>
                      <h6>Lavando</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="card">
                <div class="card-body">
                  <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle text-success fs-1 me-3"></i>

                    <div>
                      <h6>Finalizados</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-header">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h5 class="mb-1">
                        <i class="bi bi-hourglass-split me-1"></i>

                        Aguardando
                      </h5>
                    </div>
                  </div>
                </div>

                <div class="card-body">
                  <div class="card mb-3">
                    <div class="card-body">
                      <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-car-front fs-3 text-primary me-3"></i>

                        <div>
                          <h6>Toyota Corolla</h6>
                        </div>
                      </div>

                      <button type="button" class="btn btn-primary w-100">
                        Iniciar Lavagem
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-header">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h5 class="mb-1">
                        <i class="bi bi-droplet me-1"></i>

                        Lavando
                      </h5>
                    </div>
                  </div>
                </div>

                <div class="card-body">
                  <div class="card mb-3">
                    <div class="card-body">
                      <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-car-front fs-3 text-primary me-3"></i>

                        <div>
                          <h6 class="mb-1">Honda Civic</h6>
                        </div>
                      </div>

                      <button type="button" class="btn btn-success w-100">
                        Finalizar Lavagem
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-header">
                  <div class="d-flex justify-content-between">
                    <div>
                      <h5 class="mb-1">
                        <i class="bi bi-check-circle me-1"></i>

                        Finalizados
                      </h5>
                    </div>
                  </div>
                </div>

                <div class="card-body">
                  <div class="card mb-3">
                    <div class="card-body">
                      <div class="d-flex align-items-center">
                        <i class="bi bi-car-front fs-3 text-success me-3"></i>

                        <div>
                          <h6 class="mb-1">Volkswagen Golf</h6>

                          <div class="mt-2">
                            <span class="badge bg-success"> Concluído </span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
