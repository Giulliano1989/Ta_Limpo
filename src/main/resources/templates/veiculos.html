<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!--Cabeçalho-->
    <header class="d-flex justify-content-between bg-light align-items-center px-4 py-3 border-bottom border-primary">
      <div class="d-flex align-items-center gap-3">
        <img th:src="@{/assets/img/logo.png}" alt="TCC" height="120" />
        <span class="fs-4 d-none d-md-inline">Carlos Eduardo</span>
      </div>

      <button
        class="btn btn-outline-primary d-md-none"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-controls="sidebar"
        aria-label="Abrir menu"
      >
        <i class="bi bi-list"></i>
      </button>
    </header>

    <div class="d-md-flex">
      <!--Menu mobile-->
      <div class="offcanvas offcanvas-start d-md-none bg-dark text-white" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
        <div class="offcanvas-header">
          <h5 id="sidebarLabel" class="text-white">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body p-0">
          <nav class="nav nav-pills flex-column py-4 px-3">
            <a href="/inicio" class="nav-link text-white">
              <i class="bi bi-house"></i> <span>Pagina Inicial</span>
            </a>
            <a href="/veiculos" class="nav-link active text-white">
              <i class="bi bi-car-front"></i> <span>Lista de Veículos</span>
            </a>
            <a href="/status" class="nav-link text-white">
              <i class="bi bi-clipboard-data"></i> <span>Status</span>
            </a>
            <a href="/admin" class="nav-link text-white">
              <i class="bi bi-person-gear"></i> <span>Admin</span>
            </a>
          </nav>
        </div>
      </div>

      <!--Menu desktop-->
      <div class="d-none d-md-block">
        <nav class="bg-dark vh-100" style="width: 300px">
          <ul class="nav nav-pills flex-column py-4 px-3">
            <li class="nav-item">
              <a href="/inicio" class="nav-link text-white">
                <i class="bi bi-house"></i> <span>Pagina Inicial</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/veiculos" class="nav-link active text-white">
                <i class="bi bi-car-front"></i> <span>Lista de Veículos</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/status" class="nav-link text-white">
                <i class="bi bi-clipboard-data"></i> <span>Status</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="/admin" class="nav-link text-white">
                <i class="bi bi-person-gear"></i> <span>Admin</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <!-- Conteudo-->
      <main class="w-100 p-4">
        <div
          class="d-flex justify-content-between border-bottom border-primary pb-3 mb-3"
        >
          <h3>Veículos</h3>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modal_veiculos"
          >
            Novo Veículo
          </button>
        </div>

        <table class="table" id="table_veiculos">
          <thead>
            <th>ID</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Opções</th>
          </thead>
          <tbody ></tbody>
        </table>
      </main>
    </div>

    <footer></footer>

    <!-- Modal -->
    <div class="modal" tabindex="-1" id="modal_veiculos">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Novo veículo</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form action="/veiculos" method="post">
              <div class="mb-3">
                <label for="marca" class="form-label">Marca:</label>
                <input
                  type="text"
                  id="marca"
                  name="marca"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="modelo" class="form-label">Modelo:</label>
                <input
                  type="text"
                  id="modelo"
                  name="modelo"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="placa" class="form-label">Placa:</label>
                <input
                  type="text"
                  id="placa"
                  name="placa"
                  class="form-control"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="submit" class="btn btn-primary" onclick="cadastrarVeiculo()">Cadastrar</button>
          </div>
        </div>
      </div>
    </div>

    <!--link para JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script th:src="@{/js/veiculos.js}"></script>
  </body>
</html>
