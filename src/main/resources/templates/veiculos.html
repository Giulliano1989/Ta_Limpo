<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="container-fluid">
      <div class="row">
      <div th:replace="~{fragments/layout :: sidebar('veiculos')}"></div>

      <main class="col-md-9 col-lg-10 p-3 p-md-4">
        <div
          class="d-flex justify-content-between border-bottom border-primary pb-3 mb-3"
        >
          <h3>Veículos</h3>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modal_veiculos"
          >
            Novo Veículo
          </button>
        </div>

        <table class="table" id="table_veiculos">
          <thead>
            <th>ID</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Opções</th>
          </thead>
          <tbody></tbody>
        </table>
      </main>
      </div>
    </div>

    <footer></footer>

    <div class="modal" tabindex="-1" id="modal_veiculos">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Novo veículo</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form action="/veiculos" method="post">
              <div class="mb-3">
                <label for="marca" class="form-label">Marca:</label>
                <input
                  type="text"
                  id="marca"
                  name="marca"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="modelo" class="form-label">Modelo:</label>
                <input
                  type="text"
                  id="modelo"
                  name="modelo"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="placa" class="form-label">Placa:</label>
                <input
                  type="text"
                  id="placa"
                  name="placa"
                  class="form-control"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="cadastrarVeiculo()"
            >
              Cadastrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script th:src="@{/js/veiculos.js}"></script>
  </body>
</html>
